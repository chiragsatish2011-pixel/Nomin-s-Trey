name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Windows NSIS Installer
        run: npm --workspace=@nomin/desktop run installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect Windows Installer & Compute SHA-256
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp apps/desktop/dist/Trey-Setup-*.exe release-artifacts/ || true
          cd release-artifacts
          sha256sum Trey-Setup-*.exe > windows-sha256.txt || true
          cat windows-sha256.txt

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-artifacts/*

  build-android:
    name: Build Android Companion APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Install Dependencies
        run: npm ci

      - name: Build Mobile Web App
        run: npm --workspace=@nomin/mobile run build

      - name: Sync Web Assets to Android App
        run: |
          cd apps/mobile
          npx cap sync android

      - name: Assemble Android APK
        shell: bash
        run: |
          cd apps/mobile/android
          TAG_VAL="${{ github.ref_name }}"
          if [ -z "$TAG_VAL" ]; then TAG_VAL="${{ inputs.tag_name }}"; fi

          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Signing with repository secret keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            export KEYSTORE_FILE="$PWD/release.keystore"
            export KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
            export KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
            export KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
            gradle assembleRelease
            mkdir -p ../../../release-artifacts
            cp app/build/outputs/apk/release/*.apk ../../../release-artifacts/trey-companion-${TAG_VAL}.apk || true
          else
            echo "Building debug-signed release fallback APK..."
            gradle assembleDebug
            mkdir -p ../../../release-artifacts
            find app/build/outputs/apk -name "*.apk" -exec cp {} ../../../release-artifacts/trey-companion-${TAG_VAL}-debug-signed.apk \;
          fi

          cd ../../../release-artifacts
          sha256sum trey-companion-*.apk > android-sha256.txt || true
          cat android-sha256.txt

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-artifacts/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-dist

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-dist

      - name: Generate Combined Checksum Manifest
        shell: bash
        run: |
          cd release-dist
          rm -f windows-sha256.txt android-sha256.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: "Trey ${{ github.ref_name || inputs.tag_name }} (Windows & Android Companion)"
          draft: false
          prerelease: false
          files: release-dist/*
          body: |
            ## Trey by Chirag S / The Nomin Company
            **Version:** ${{ github.ref_name || inputs.tag_name }}
            **Copyright:** (c) 2026 Nomin / Chirag S

            ### Downloads
            - **Windows Desktop:** `Trey-Setup-*.exe` (Installer for Windows 10/11 x64)
            - **Android Companion App:** `trey-companion-*.apk` (Companion & Standalone Focus App)
            - **Checksums:** `SHA256SUMS.txt`

            ### Android Installation Note
            When installing the APK on your device:
            1. Download the `.apk` file to your Android phone.
            2. In system settings or your browser prompt, toggle **"Allow installation from this source"**.
            3. Tap Install.

            ### Pairing with PC
            1. Launch Trey on Windows.
            2. Open Dashboard -> click **"Pair Phone"**.
            3. Scan the ephemeral QR code in the Trey Android Companion app.
